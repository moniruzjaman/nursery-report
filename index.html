  <title>কুড়িগ্রাম জেলা নার্সারী মূল্যায়ন ২০২৬</title>

  <!-- Google Fonts: Noto Sans Bengali -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Local Font Fallback ── */
    @font-face {
      font-family: 'Noto Sans Bengali';
      src: url('fonts/NotoSansBengali.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'Noto Serif Bengali';
      src: url('fonts/NotoSerifBengali.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans Bengali', 'Noto Serif Bengali', sans-serif;
      background: #070f0b;
      color: #e0f0e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Hero Section ── */
    .hero {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 8px 40px rgba(0, 200, 120, 0.15);
    }

    /* ── Content Card ── */
    .content {
      width: 90%;
      max-width: 800px;
      margin: -40px auto 0;
      position: relative;
      z-index: 2;
      background: linear-gradient(145deg, #0e2a1e, #0a1f15);
      border: 1px solid #1a4d35;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
    }

    .content h1 {
      font-family: 'Noto Serif Bengali', serif;
      font-size: 1.75rem;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .content h2 {
      font-family: 'Noto Serif Bengali', serif;
      font-size: 1.1rem;
      color: #b8e6c9;
      margin-bottom: 12px;
    }
  </style>
</head>
